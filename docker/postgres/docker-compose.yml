services:
  postgres:
    image: postgres:16-alpine
    container_name: allcert-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: allcert
      POSTGRES_PASSWORD: allcert1234
      POSTGRES_DB: allcert_db
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: allcert-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@allcert.local
      PGADMIN_DEFAULT_PASSWORD: admin1234
      PGADMIN_CONFIG_SERVER_MODE: "False"
      TZ: Asia/Seoul
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:
